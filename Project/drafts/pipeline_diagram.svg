<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 600" width="1680" height="600" font-family="Inter, Helvetica Neue, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8eaed"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ab4f8"/>
    </marker>
  </defs>

  <!-- OWNER -->
  <rect x="335" y="30" width="290" height="86" rx="43"
        fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">HUMAN OWNER</text>
  <text x="480" y="94" text-anchor="middle" font-size="19" fill="#5f6368">holds the only signing key</text>

  <path d="M 480 116 L 480 196" stroke="#f9ab00" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="497" y="163" font-size="17" fill="#ffffff">signs one capability worth N runs</text>

  <!-- ROW OF STAGES -->
  <!-- 1. AI WRITES — with the gated loop arcing over it -->
  <path d="M 246 196 C 246 118, 54 118, 54 196"
        fill="none" stroke="#8ab4f8" stroke-width="2.5"
        marker-end="url(#arrowBlue)"/>
  <text x="150" y="108" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">research &#8594; plan &#8594; one run</text>
  <text x="150" y="132" text-anchor="middle" font-size="18" fill="#ffffff">3 strikes &#8594; new approach</text>

  <rect x="30" y="200" width="240" height="196" rx="14"
        fill="#e8f0fe" stroke="#4285f4" stroke-width="2.5"/>
  <text x="150" y="252" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">AI WRITES</text>
  <text x="150" y="281" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">THE KERNEL</text>
  <text x="150" y="323" text-anchor="middle" font-size="19" fill="#5f6368">Triton / CUDA</text>
  <text x="150" y="360" text-anchor="middle" font-size="18" font-style="italic" fill="#1a73e8">inside a gated loop</text>

  <path d="M 274 298 L 316 298" stroke="#e8eaed" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. PERMIT -->
  <rect x="320" y="200" width="240" height="196" rx="14"
        fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="440" y="243" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">PERMIT</text>
  <text x="440" y="286" text-anchor="middle" font-size="19" fill="#5f6368">single use</text>
  <text x="440" y="314" text-anchor="middle" font-size="19" fill="#5f6368">bound to that</text>
  <text x="440" y="342" text-anchor="middle" font-size="19" fill="#5f6368">file's sha256</text>
  <text x="440" y="374" text-anchor="middle" font-size="18" font-style="italic" fill="#b06000">usable once</text>

  <path d="M 564 298 L 606 298" stroke="#e8eaed" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. LOCKED REFEREE -->
  <rect x="610" y="200" width="240" height="196" rx="14"
        fill="#fce8e6" stroke="#d93025" stroke-width="2.5"/>
  <text x="730" y="243" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">LOCKED</text>
  <text x="730" y="272" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">REFEREE</text>
  <text x="730" y="314" text-anchor="middle" font-size="19" fill="#5f6368">29 files, Ed25519</text>
  <text x="730" y="352" text-anchor="middle" font-size="18" font-style="italic" fill="#c5221f">re-hashed before</text>
  <text x="730" y="374" text-anchor="middle" font-size="18" font-style="italic" fill="#c5221f">every single run</text>

  <path d="M 854 298 L 896 298" stroke="#e8eaed" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. SANDBOX -->
  <rect x="900" y="200" width="240" height="196" rx="14"
        fill="#fce8e6" stroke="#d93025" stroke-width="2.5"/>
  <text x="1020" y="243" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">SANDBOX</text>
  <text x="1020" y="286" text-anchor="middle" font-size="19" fill="#5f6368">no network</text>
  <text x="1020" y="314" text-anchor="middle" font-size="19" fill="#5f6368">no home directory</text>
  <text x="1020" y="342" text-anchor="middle" font-size="19" fill="#5f6368">source read-only</text>

  <path d="M 1144 298 L 1186 298" stroke="#e8eaed" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 5. EVIDENCE -->
  <rect x="1190" y="200" width="240" height="196" rx="14"
        fill="#e6f4ea" stroke="#34a853" stroke-width="2.5"/>
  <text x="1310" y="243" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">EVIDENCE</text>
  <text x="1310" y="286" text-anchor="middle" font-size="19" fill="#5f6368">300 raw samples</text>
  <text x="1310" y="314" text-anchor="middle" font-size="19" fill="#5f6368">every trial kept</text>
  <text x="1310" y="352" text-anchor="middle" font-size="18" font-style="italic" fill="#137333">content-addressed,</text>
  <text x="1310" y="374" text-anchor="middle" font-size="18" font-style="italic" fill="#137333">hash-chained</text>

  <path d="M 1434 298 L 1476 298" stroke="#9aa0a6" stroke-width="2.5"
        stroke-dasharray="7 6" marker-end="url(#arrowDash)"/>

  <!-- 6. AUDIT -->
  <rect x="1480" y="200" width="170" height="196" rx="14"
        fill="#f3e8fd" stroke="#a142f4" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="1565" y="243" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">AUDIT</text>
  <text x="1565" y="286" text-anchor="middle" font-size="19" fill="#5f6368">GPT-5.6</text>
  <text x="1565" y="314" text-anchor="middle" font-size="19" fill="#5f6368">packet only</text>
  <text x="1565" y="342" text-anchor="middle" font-size="19" fill="#5f6368">typed verdict</text>

  <!-- DIVIDING BRACKETS -->
  <path d="M 30 436 L 30 452 L 270 452 L 270 436" fill="none" stroke="#8ab4f8" stroke-width="2.5"/>
  <text x="150" y="484" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">the AI edits this</text>

  <path d="M 320 436 L 320 452 L 1650 452 L 1650 436" fill="none" stroke="#f28b82" stroke-width="2.5"/>
  <text x="985" y="484" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">the AI has no key and no write access to any of this</text>

  <!-- FOOTER -->
  <text x="840" y="546" text-anchor="middle" font-size="21" fill="#ffffff">
    <tspan font-weight="700">272 permits issued &#183; 271 consumed.</tspan>
    <tspan> The agent never measured its own work.</tspan>
  </text>

</svg>
